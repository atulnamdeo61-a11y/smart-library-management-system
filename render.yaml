services:
  - type: web
    name: smart-library-management-system
    runtime: python
    buildCommand: pip install -r requirements.txt && python render_build.py
    startCommand: gunicorn run:app
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_CONFIG
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: UPI_ID
        value: smartlibrary@upi
      - key: UPI_PAYEE_NAME
        value: Smart College Library
      - key: ID_CARD_FEE
        value: "50.00"
      - key: DEFAULT_BORROW_DAYS
        value: "14"
      - key: FINE_RATE_PER_DAY
        value: "2.00"
