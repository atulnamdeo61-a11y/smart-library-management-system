{% extends "base.html" %}

{% block title %}Reading Preferences - Smart Library{% endblock %}

{% block content %}
<div class="container py-2">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="smart-card p-4 p-md-5 shadow-sm">
                <div class="d-flex align-items-center gap-3 mb-4">
                    <span class="brand-icon-wrapper" style="width: 48px; height: 48px; font-size: 1.4rem;">
                        <i class="bi bi-heart-fill"></i>
                    </span>
                    <div>
                        <h3 class="fw-bold mb-1">Set Your Reading Preferences</h3>
                        <p class="text-muted small mb-0">Select your favorite academic topics to tune the Smart Recommendation Engine.</p>
                    </div>
                </div>

                <form method="POST" action="{{ url_for('student.preferences') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="row g-3 mb-4">
                        {% for cat in categories %}
                            <div class="col-md-6">
                                <label class="p-3 bg-light rounded-3 border d-flex align-items-start gap-3 h-100 cursor-pointer hover-bg-light">
                                    <input type="checkbox" name="category_ids" value="{{ cat.id }}" class="form-check-input mt-1" 
                                           {% if cat.id in current_pref_ids %}checked{% endif %}>
                                    <div>
                                        <div class="fw-bold text-dark">{{ cat.name }}</div>
                                        <div class="small text-muted">{{ cat.description or 'Books and journals on this topic.' }}</div>
                                    </div>
                                </label>
                            </div>
                        {% endfor %}
                    </div>

                    <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                        <a href="{{ url_for('student.recommendations') }}" class="btn btn-outline-secondary">
                            Cancel
                        </a>
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="bi bi-check-lg me-1"></i> Save Reading Interests
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
