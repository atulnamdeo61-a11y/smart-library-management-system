{% extends "base.html" %}

{% block title %}400 - Bad Request{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="smart-card p-5 shadow-sm">
                <div class="display-1 fw-bold text-secondary mb-3">400</div>
                <h3 class="fw-bold mb-2">Bad Request</h3>
                <p class="text-muted mb-4">
                    The submitted request parameters or form data could not be validated.
                </p>
                <a href="{{ url_for('index') }}" class="btn btn-primary">
                    <i class="bi bi-house"></i> Return to Homepage
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
