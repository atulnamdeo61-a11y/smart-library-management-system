{% extends "base.html" %}

{% block title %}Create Librarian - Admin Portal{% endblock %}

{% block content %}
<div class="container py-2">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="smart-card p-4 p-md-5 shadow-sm">
                <div class="d-flex align-items-center gap-3 mb-4">
                    <span class="brand-icon-wrapper" style="width: 52px; height: 52px; font-size: 1.5rem;">
                        <i class="bi bi-person-badge-fill"></i>
                    </span>
                    <div>
                        <h3 class="fw-bold mb-0">Create Librarian Account</h3>
                        <p class="text-muted small mb-0">Grant library staff privileges for circulation, returns, and counter operations</p>
                    </div>
                </div>

                <form method="POST" action="{{ url_for('admin.librarian_new') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="mb-3">
                        <label class="form-label" for="full_name">Staff Full Name</label>
                        <input type="text" name="full_name" id="full_name" class="form-control" placeholder="e.g. Mrs. Sunita Verma" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="email">Staff College Email</label>
                        <input type="email" name="email" id="email" class="form-control" placeholder="e.g. librarian@college.edu" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="password">Initial Password</label>
                        <input type="password" name="password" id="password" class="form-control" placeholder="Min. 6 characters" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label" for="phone">Phone Number</label>
                        <input type="text" name="phone" id="phone" class="form-control" placeholder="+91 98765 12345">
                    </div>

                    <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                        <a href="{{ url_for('admin.users_list', role='librarian') }}" class="btn btn-outline-secondary">
                            Cancel
                        </a>
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="bi bi-check2-circle me-1"></i> Create Staff Account
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
